[package]
name = "zellij-relay-client"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Zellij-side relay code: sharer tunnel and remote viewer"

[dependencies]
crossterm = { workspace = true, optional = true }
anyhow = { workspace = true }
log = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
zellij-utils = { workspace = true }

notify = { workspace = true, optional = true }
zellij-browser-bridge = { workspace = true, optional = true }
zellij-relay-protocol = { workspace = true, optional = true }
zellij-web-client-assets = { workspace = true, optional = true }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"], optional = true }
futures-util = { version = "0.3", optional = true }
isahc = { workspace = true, optional = true }
url = { workspace = true, optional = true }
dialoguer = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
argon2 = { workspace = true, optional = true }
zxcvbn = { workspace = true, optional = true }
console = { workspace = true, optional = true }
urlencoding = { version = "2.1", optional = true }
rustls = { version = "0.23", default-features = false, features = ["std"], optional = true }
tokio-rustls = { version = "0.26", optional = true }
rustls-pemfile = { version = "2", optional = true }
rustls-native-certs = { version = "0.8", optional = true }
rustls-pki-types = { version = "1", optional = true }
x509-parser = { version = "0.18", optional = true }
base64 = { version = "0.22", optional = true }

[dev-dependencies]
axum = { version = "0.8.4", features = ["ws"] }
axum-extra = { version = "0.12", features = ["cookie"] }
axum-server = { version = "0.8", features = ["tls-rustls"] }
rcgen = "0.14"
tempfile = "3"
serial_test = "3.0"

[features]
tunnel = ["dep:zellij-browser-bridge", "dep:tokio-tungstenite", "dep:futures-util", "dep:zellij-relay-protocol", "dep:zellij-web-client-assets", "dep:notify"]
attach = ["dep:crossterm", "zellij-utils/web_server_capability", "dep:zellij-relay-protocol", "dep:tokio-tungstenite", "dep:futures-util", "dep:isahc", "dep:url", "dep:dialoguer", "dep:sha2", "dep:argon2", "dep:zxcvbn", "dep:console", "dep:urlencoding", "dep:rustls", "dep:tokio-rustls", "dep:rustls-pemfile", "dep:rustls-native-certs", "dep:rustls-pki-types", "dep:x509-parser", "dep:base64"]
