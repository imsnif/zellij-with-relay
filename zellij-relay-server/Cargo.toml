[package]
name = "zellij-relay-server"
version.workspace = true
authors = ["Aram Drevekenin <aram@poor.dev>"]
edition.workspace = true
description = "Relay server for Zellij remote session sharing"
license.workspace = true

[dependencies]
anyhow = { workspace = true }
axum = { version = "0.8.4", features = ["ws"] }
futures-util = "0.3"
log = { workspace = true }
prost = { workspace = true }
clap = { version = "4", features = ["derive"] }
directories = { version = "6.0", default-features = false }
rand = "0.8"
rusqlite = { version = "0.30", default-features = false, features = ["bundled"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal"] }
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = { workspace = true }
uuid = { workspace = true }
zellij-relay-protocol = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[dev-dependencies]
serial_test = "3.0"
tempfile = { workspace = true }
tokio-tungstenite = "0.28"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "cookies"] }

[[bin]]
name = "zellij-relay-server"
path = "src/main.rs"
